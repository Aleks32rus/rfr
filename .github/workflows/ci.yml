name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      java: ${{ steps.filter.outputs.java }}
      api: ${{ steps.filter.outputs.api }}
      auth: ${{ steps.filter.outputs.auth }}
      e2e: ${{ steps.filter.outputs.e2e }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/ci.yml'
            java:
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'buildSrc/**'
            api:
              - 'rfr-api/**'
            auth:
              - 'rfr-auth/**'
            e2e:
              - 'rfr-e2e/**'
            frontend:
              - 'rfr-gql-client/**'

  api:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.java == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Собрать API
        run: ./gradlew :rfr-api:assemble --no-daemon

  auth:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.java == 'true' || needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Собрать сервер авторизации
        run: ./gradlew :rfr-auth:assemble --no-daemon

  e2e:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.java == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Скомпилировать E2E без запуска тестов
        run: ./gradlew :rfr-e2e:testClasses --no-daemon

  frontend:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
